<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Settings: a white gear on a graphite-to-violet rounded-square tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A44"/>
      <stop offset="1" stop-color="#16161C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#A855F7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="hole">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="512" cy="512" r="96" fill="#000000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="420" fill="url(#glow)"/>
  <g fill="#FFFFFF" mask="url(#hole)">
    <circle cx="512" cy="512" r="236"/>
    <g id="tooth"><rect x="452" y="196" width="120" height="140" rx="28"/></g>
    <use href="#tooth" transform="rotate(45 512 512)"/>
    <use href="#tooth" transform="rotate(90 512 512)"/>
    <use href="#tooth" transform="rotate(135 512 512)"/>
    <use href="#tooth" transform="rotate(180 512 512)"/>
    <use href="#tooth" transform="rotate(225 512 512)"/>
    <use href="#tooth" transform="rotate(270 512 512)"/>
    <use href="#tooth" transform="rotate(315 512 512)"/>
  </g>
  <circle cx="512" cy="512" r="150" fill="none" stroke="#A855F7" stroke-width="28"/>
  <rect width="1024" height="1024" rx="230" fill="url(#sheen)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="226" fill="none"
        stroke="#FFFFFF" stroke-opacity=".14" stroke-width="8"/>
</svg>
