<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC56B"/>
      <stop offset="1" stop-color="#E8603C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2340" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".4"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="28" y="52" width="176" height="176" rx="44"/>
    </clipPath>
    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <!-- Sun rising behind the glass -->
  <circle cx="180" cy="76" r="56" fill="url(#sun)"/>
  <!-- Frosted tile: blurred copy of the sun seen through the glass -->
  <g clip-path="url(#tile)">
    <circle cx="180" cy="76" r="56" fill="url(#sun)" filter="url(#frost)"/>
  </g>
  <rect x="28" y="52" width="176" height="176" rx="44" fill="url(#glass)"/>
  <rect x="28" y="52" width="176" height="176" rx="44" fill="url(#sheen)"/>
  <rect x="29.5" y="53.5" width="173" height="173" rx="42.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- Z -->
  <path d="M80 108 H152 L80 172 H152" fill="none" stroke="#FFFFFF" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
