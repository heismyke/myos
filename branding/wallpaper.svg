<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151B33"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="3840" height="2160">
      <feGaussianBlur stdDeviation="260"/>
    </filter>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <!-- Colour fields for the glass panels to blur over -->
  <g filter="url(#soft)">
    <circle cx="2750" cy="760" r="620" fill="#F28C38" fill-opacity=".60"/>
    <circle cx="3250" cy="1500" r="560" fill="#E8603C" fill-opacity=".45"/>
    <circle cx="850" cy="1650" r="760" fill="#14B8A6" fill-opacity=".32"/>
    <circle cx="1250" cy="380" r="560" fill="#6366F1" fill-opacity=".30"/>
  </g>
  <!-- Faint Zuma Rock silhouette on the horizon -->
  <path d="M0 2160 V1880 C 600 1840 1100 1800 1500 1700 C 1700 1520 1800 1340 2050 1320
           C 2300 1300 2420 1500 2560 1700 C 3000 1800 3400 1840 3840 1860 V2160 Z"
        fill="#05070F" fill-opacity=".55"/>
  <path d="M1500 1700 C 1700 1520 1800 1340 2050 1320 C 2300 1300 2420 1500 2560 1700"
        fill="none" stroke="url(#horizon)" stroke-width="6"/>
</svg>
